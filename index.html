const ladders={3:11,8:18,14:25,22:34,31:41,37:46},snakes={16:7,27:19,35:24,43:29,47:38};
const teacher=[6,20,39],steal=[12,30,44],duel=[10,26,40]; let turn=0,pending=null,current=null,used=new Set(),locked=false;
function level(n){return n<=16?1:n<=32?2:3}
function board(){let b=document.getElementById('board'),arr=[];for(let r=5;r>=0;r--){let row=[];for(let c=1;c<=8;c++)row.push(r*8+c);if(r%2)row.reverse();arr.push(...row)};b.innerHTML=arr.map(n=>{let i='',l='';if(ladders[n])i='🪜';if(snakes[n])i='🐍';if(teacher.includes(n)){i='👩‍🏫';l='تحدي المعلمة'}if(steal.includes(n)){i='💰';l='مكافأة'}if(duel.includes(n)){i='⚔️';l='اختاري منافسًا'}if(n==48){i='🏆';l='النهاية'}return `<div class="cell" id="c${n}"><span class="num">${n}</span><span class="icon">${i}</span><span class="lab">${l}</span><div class="tokens"></div></div>`}).join('')}

function getQ(l){let pool=qs.map((q,i)=>({...q,i})).filter(x=>x.level==l&&!used.has(x.i));if(!pool.length){qs.forEach((q,i)=>{if(q.level==l)used.delete(i)});return getQ(l)}let q=pool[Math.floor(Math.random()*pool.length)];used.add(q.i);return q}
function showQ(l,duelTarget=null){current=getQ(l);locked=false;let tag=l==1?'أساسي':l==2?'متوسط':'تحدي';let b=document.getElementById('qbox');b.innerHTML=`<span class="badge">${tag}</span><span class="badge">${current.topic}</span><div class="q">${current.q}</div><div class="opts"></div>`;b.querySelector('.opts').innerHTML=current.o.map((o,i)=>`<button class="opt" onclick="${duelTarget===null?`answer(${i==current.a})`:`duelAnswer(${i==current.a},${duelTarget})`}">${o}</button>`).join('')}
function roll(){if(pending!==null)return;let r=Math.floor(Math.random()*6)+1;document.getElementById('die').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][r-1];let t=groups[turn].pos+r;pending=t>48?groups[turn].pos:t;document.getElementById('move').textContent='النتيجة: '+r+' — أجيبي لتثبيت الحركة';showQ(level(pending))}
function answer(ok){if(locked||pending===null)return;locked=true;if(ok){groups[turn].score+=10;groups[turn].pos=pending;statusMsg('إجابة صحيحة +10 ✅','good');effect()}else{groups[turn].score=Math.max(0,groups[turn].score-2);statusMsg('إجابة غير صحيحة ❌ الصحيح: '+current.o[current.a],'bad');finish()}pending=null;render()}
function effect(){let p=groups[turn].pos;if(ladders[p]){groups[turn].pos=ladders[p];groups[turn].score+=5;statusMsg('سُلَّم! +5 نقاط','good');finish()}else if(snakes[p]){groups[turn].pos=snakes[p];statusMsg('ثعبان! هبوط','bad');finish()}else if(teacher.includes(p))teacherBox();else if(steal.includes(p))stealBox();else if(duel.includes(p))duelBox();else if(p==48)win();else finish()}
function statusMsg(t,c){let s=document.getElementById('status');s.className=c;s.textContent=t}
function teacherBox(){openModal(`<h2>👩‍🏫 تحدي المعلمة</h2><p>اطرحي سؤالًا شفهيًا إضافيًا. النجاح = +15 نقطة.</p><button class="primary" onclick="teacherResult(true)">نجحت</button> <button class="secondary" onclick="teacherResult(false)">لم تنجح</button>`)}
function teacherResult(ok){if(ok)groups[turn].score+=15;closeModal();finish()}
function stealBox(){openModal(`<h2>🎁 مكافأة</h2><p>أحسنتِ! حصلت مجموعتك على <b>10 نقاط إضافية</b>.</p><button class="primary" onclick="rewardDo()">استلام المكافأة</button>`)}
function rewardDo(){groups[turn].score+=10;closeModal();statusMsg('🎁 مكافأة +10 نقاط','good');finish()}
function duelBox(){let o=groups.map((g,i)=>i==turn?'':`<option value="${i}">${g.name}</option>`).join('');openModal(`<h2>⚔️ اختاري مجموعة منافسة</h2><select id="target">${o}</select><button class="primary" onclick="duelStart()">ابدأ</button>`)}
function duelStart(){let e=+document.getElementById('target').value;closeModal();showQ(3,e)}
function duelAnswer(ok,e){if(locked)return;locked=true;if(ok)groups[turn].score+=10;else groups[e].score+=10;finish()}
function openModal(h){document.getElementById('modalbox').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function finish(){render();if(groups[turn].pos==48)return win();setTimeout(()=>{turn=(turn+1)%6;render();document.getElementById('qbox').textContent='ابدئي برمي النرد.';document.getElementById('status').textContent='';document.getElementById('die').textContent='🎲';document.getElementById('move').textContent=''},700)}
function win(){confetti();openModal(`<h2>🏆 الفائز: ${groups[turn].name}</h2><p>النتيجة: ${groups[turn].score} نقطة</p><button class="primary" onclick="closeModal()">عرض اللوحة</button>`)}
function confetti(){let b=document.getElementById('confetti');b.innerHTML='';for(let i=0;i<50;i++){let s=document.createElement('span');s.className='piece';s.textContent=['🎉','✨','⭐','🏆'][Math.floor(Math.random()*4)];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()+'s';b.appendChild(s)}setTimeout(()=>b.innerHTML='',4000)}
function resetGame(){if(confirm('إعادة اللعبة؟')){groups.forEach(g=>{g.pos=1;g.score=0});turn=0;pending=null;used.clear();render()}}
board();render();
</script></body></html>
